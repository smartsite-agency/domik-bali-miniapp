<text class="t3 halo" x="578" y="148" text-anchor="middle">≈ 2,3 м²</text>
<text class="t1 halo" x="540" y="458" text-anchor="middle">Терраса</text>
<text class="t2 halo" x="540" y="488" text-anchor="middle">8,4 м²</text>
