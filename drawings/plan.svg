<svg xmlns="http://www.w3.org/2000/svg" class="dwg" viewBox="-200 -215 1080 925" width="648" height="555" role="img" aria-label="План этажа дома 7 × 4 м">
<title>План этажа дома 7 × 4 м</title>
<!--
  План этажа. Дом 7 × 4 м (28 м² по наружному контуру). Масштаб 1 м = 60 px: viewBox в сантиметрах, width = см × 0,6.
  Зоны по длине (по осям перегородок): гостиная с кухней 2,80, санузел 1,50, спальня 2,70.
  Наружная стена 12 см, перегородки 10 см — уточнить.
  Санузел у фасада, глубина 2,20 по оси; проход за ним вдоль задней стены ≈ 1,6 в чистоте.
  Проём из гостиной в проход 90 см без двери, дверь в спальню 80 см, дверь санузла 70 см наружу — уточнить.
  Окна задней стены: над кухней 1,40, в спальне 1,10; высокое окно санузла 0,70 — уточнить.
  Мебель и сантехника — типовые размеры, уточнить.
  Площади зон — по внутренним размерам (в чистоте).
-->
<style>
svg.dwg{--d-ink:#0B2A59;--d-muted:#3F597E;--d-line:#BCCBDF;--d-paper:#EFF4F6;--d-accent:#2D52A2;--d-soft:#70A9F2}
@media (prefers-color-scheme:dark){svg.dwg{--d-ink:#DBE6EC;--d-muted:#B1C0CF;--d-line:#244A7F;--d-paper:#1A3B66;--d-accent:#70A9F2;--d-soft:#A7CBF0}}
.dwg .bg{fill:var(--d-paper)}
.dwg .pc{fill:var(--d-ink)}
.dwg .ac{fill:var(--d-accent)}
.dwg .ln,.dwg .th,.dwg .mu,.dwg .hl,.dwg .fx,.dwg .pa,.dwg .sf,.dwg .gl,.dwg .gls,.dwg .acl,.dwg .act,.dwg .dim{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.dwg .ln{fill:none;stroke:var(--d-ink);stroke-width:1.6px}
.dwg .th{fill:none;stroke:var(--d-ink);stroke-width:.9px}
.dwg .mu{fill:none;stroke:var(--d-muted);stroke-width:.9px}
.dwg .hl{fill:none;stroke:var(--d-line);stroke-width:.9px}
.dwg .fx{fill:var(--d-paper);stroke:var(--d-muted);stroke-width:1px}
.dwg .pa{fill:var(--d-paper);stroke:var(--d-ink);stroke-width:1.1px}
.dwg .sf{fill:var(--d-line);stroke:var(--d-ink);stroke-width:1.1px}
.dwg .gl{fill:none;stroke:var(--d-accent);stroke-width:1.8px}
.dwg .gls{fill:var(--d-soft);fill-opacity:.22;stroke:var(--d-accent);stroke-width:1px}
.dwg .acl{fill:none;stroke:var(--d-accent);stroke-width:1.6px}
.dwg .act{fill:none;stroke:var(--d-accent);stroke-width:.9px}
.dwg .dim{fill:none;stroke:var(--d-muted);stroke-width:.8px}
.dwg .dash{stroke-dasharray:14 9}
.dwg .dd{stroke-dasharray:26 8 4 8}
.dwg text{font-family:Literata,Georgia,serif;fill:var(--d-ink)}
.dwg .ttl{font-family:"Roboto Slab",Georgia,serif;font-weight:700;font-size:34px}
.dwg .t1{font-size:30px;font-weight:600}
.dwg .t2{font-size:24px;fill:var(--d-muted)}
.dwg .t3{font-size:20px;fill:var(--d-muted)}
.dwg .dt{font-size:22px;fill:var(--d-muted);font-variant-numeric:tabular-nums}
.dwg .halo{paint-order:stroke;stroke:var(--d-paper);stroke-width:7px;stroke-linejoin:round}
</style>
<rect class="bg" x="-200" y="-215" width="1080" height="925"/>
<!-- Контур свеса крыши: 1,20 над террасой, 0,60 с остальных сторон -->
