<text class="t3 halo" x="460" y="-110" text-anchor="middle">терраса</text>
<text class="t3" x="-40" y="-420" text-anchor="end">черепица по обрешётке,</text>
<text class="t3" x="-40" y="-396" text-anchor="end">стропила 50×150</text>
<line class="dim" x1="-34" y1="-404" x2="40" y2="-350"/>
<text class="t3" x="-30" y="-200" text-anchor="end">металлокаркас,</text>
<text class="t3" x="-30" y="-176" text-anchor="end">деревянная обшивка</text>
<line class="dim" x1="-24" y1="-190" x2="0" y2="-190"/>
