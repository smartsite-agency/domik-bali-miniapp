<text class="dt" x="716" y="-6">±0,000</text>
<text class="t3" x="716" y="20">земля</text>
<line class="dim" x1="532" y1="-60" x2="850" y2="-60"/>
<polygon class="pa" points="700,-60 691,-73 709,-73"/>
<text class="dt" x="716" y="-66">+0,600</text>
<text class="t3" x="716" y="-40">пол</text>
<line class="dim" x1="532" y1="-261" x2="850" y2="-261"/>
