<text class="t3" x="222" y="144">L ≈ 2,0 м — уточнить</text>
<line class="dim" x1="216" y1="114" x2="206" y2="114"/>
<!-- Отметки высот -->
<line class="dim" x1="622" y1="0" x2="850" y2="0"/>
